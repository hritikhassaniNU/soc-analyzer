<svg xmlns="http://www.w3.org/2000/svg" width="680" height="676" viewBox="0 0 680 676" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>SOC Analyzer high-level system diagram</title>
<desc>Top to bottom: the analyst's browser runs the React app and calls the FastAPI API over HTTPS. The API handles auth and sessions, upload intake, and query APIs; it stores uploads in file storage and uses PostgreSQL for users, sessions, the job queue and results. A background worker claims jobs from PostgreSQL, reads the file and Parquet copy, and runs four stages: parse, detect, correlate and summarize, optionally calling the Claude API. API, worker and migrate are one Docker image.</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9C9A92"/></marker>
<style>
.th{font-size:14px;font-weight:600}
.ts{font-size:12px}
.lbl{font-size:12px;fill:#C9C7BE}
.edge{stroke:#9C9A92;stroke-width:1.5;fill:none}
.box{stroke-width:1}
.pf{fill:#3C3489;stroke:#AFA9EC}.pt{fill:#E5E3FB}.ps{fill:#BDB8F0}
.tf{fill:#0B4A3B;stroke:#5DCAA5}.tt{fill:#C3EEDD}.tsb{fill:#7FD6B6}
.gf{fill:#444441;stroke:#B4B2A9}.gt{fill:#E2E0D7}.gs{fill:#BDBBB2}
</style>
</defs>

<rect x="0" y="0" width="680" height="676" rx="12" fill="#1C1C1E"/>

<rect class="box gf" x="40" y="40" width="600" height="60" rx="4"/>
<text class="th gt" x="340" y="64" text-anchor="middle">Analyst's browser: React + TypeScript app</text>
<text class="ts gs" x="340" y="84" text-anchor="middle">Dashboard · Investigations · Users · Logs · Upload · Rules</text>

<line class="edge" x1="340" y1="100" x2="340" y2="138" marker-start="url(#ar)" marker-end="url(#ar)"/>
<text class="lbl" x="350" y="124">HTTPS · REST /api · session cookie</text>

<rect x="40" y="140" width="600" height="118" rx="8" fill="none" stroke="#7F77DD" stroke-dasharray="5 4"/>
<text class="lbl" x="56" y="162">API · FastAPI (also serves the React app)</text>
<rect class="box pf" x="56" y="174" width="176" height="68" rx="4"/>
<text class="th pt" x="144" y="201" text-anchor="middle">Auth and sessions</text>
<text class="ts ps" x="144" y="220" text-anchor="middle">bcrypt, cookie, 8 h</text>
<rect class="box pf" x="252" y="174" width="176" height="68" rx="4"/>
<text class="th pt" x="340" y="201" text-anchor="middle">Upload intake</text>
<text class="ts ps" x="340" y="220" text-anchor="middle">validate, store, queue</text>
<rect class="box pf" x="448" y="174" width="176" height="68" rx="4"/>
<text class="th pt" x="536" y="201" text-anchor="middle">Query APIs</text>
<text class="ts ps" x="536" y="220" text-anchor="middle">dashboard, cases, logs</text>

<line class="edge" x1="180" y1="258" x2="180" y2="298" marker-start="url(#ar)" marker-end="url(#ar)"/>
<text class="lbl" x="190" y="283">users, sessions, queue, results</text>
<line class="edge" x1="540" y1="258" x2="540" y2="298" marker-end="url(#ar)"/>
<text class="lbl" x="550" y="283">store upload</text>

<rect class="box tf" x="40" y="300" width="360" height="64" rx="4"/>
<text class="th tt" x="220" y="326" text-anchor="middle">PostgreSQL</text>
<text class="ts tsb" x="220" y="346" text-anchor="middle">job queue · events (partition per upload) · cases</text>
<rect class="box tf" x="440" y="300" width="200" height="64" rx="4"/>
<text class="th tt" x="540" y="326" text-anchor="middle">File storage</text>
<text class="ts tsb" x="540" y="346" text-anchor="middle">raw upload + Parquet copy</text>

<line class="edge" x1="180" y1="366" x2="180" y2="402" marker-start="url(#ar)" marker-end="url(#ar)"/>
<text class="lbl" x="190" y="389">claim job (SKIP LOCKED), save results</text>
<line class="edge" x1="540" y1="366" x2="540" y2="402" marker-start="url(#ar)" marker-end="url(#ar)"/>
<text class="lbl" x="532" y="389" text-anchor="end">read file, Parquet</text>

<rect x="40" y="404" width="600" height="136" rx="8" fill="none" stroke="#7F77DD" stroke-dasharray="5 4"/>
<text class="lbl" x="56" y="426">Worker · background job (same Docker image)</text>
<rect class="box pf" x="56" y="440" width="128" height="74" rx="4"/>
<text class="th pt" x="120" y="470" text-anchor="middle">Parse</text>
<text class="ts ps" x="120" y="490" text-anchor="middle">stream, line rules</text>
<rect class="box pf" x="206" y="440" width="128" height="74" rx="4"/>
<text class="th pt" x="270" y="470" text-anchor="middle">Detect</text>
<text class="ts ps" x="270" y="490" text-anchor="middle">stats, ML, AI</text>
<rect class="box pf" x="356" y="440" width="128" height="74" rx="4"/>
<text class="th pt" x="420" y="470" text-anchor="middle">Correlate</text>
<text class="ts ps" x="420" y="490" text-anchor="middle">incidents, cases</text>
<rect class="box pf" x="506" y="440" width="128" height="74" rx="4"/>
<text class="th pt" x="570" y="470" text-anchor="middle">Summarize</text>
<text class="ts ps" x="570" y="490" text-anchor="middle">Claude or template</text>
<line class="edge" x1="184" y1="477" x2="204" y2="477" marker-end="url(#ar)"/>
<line class="edge" x1="334" y1="477" x2="354" y2="477" marker-end="url(#ar)"/>
<line class="edge" x1="484" y1="477" x2="504" y2="477" marker-end="url(#ar)"/>

<line class="edge" x1="570" y1="514" x2="570" y2="578" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text class="lbl" x="562" y="562" text-anchor="end">pseudonymized data only</text>
<rect class="box gf" x="506" y="580" width="128" height="56" rx="4"/>
<text class="th gt" x="570" y="604" text-anchor="middle">Claude API</text>
<text class="ts gs" x="570" y="622" text-anchor="middle">optional</text>

<text class="lbl" x="40" y="600">Migrate (runs once): creates tables, seeds the login</text>
<text class="lbl" x="40" y="620">Local: Docker Compose · Live: Render (one container) + Neon</text>
<rect class="pf" x="40" y="638" width="12" height="12" rx="2"/><text class="lbl" x="58" y="648">App (one image)</text>
<rect class="tf" x="170" y="638" width="12" height="12" rx="2"/><text class="lbl" x="188" y="648">Data</text>
<rect class="gf" x="240" y="638" width="12" height="12" rx="2"/><text class="lbl" x="258" y="648">Outside the app</text>
</svg>
